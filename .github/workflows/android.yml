# Builds and tests the Android app on every push to android-app (or by hand from the Actions tab).
# Uses stub data only: no sign-in, no secrets, nothing reaches AWS. Actions are pinned to commits.
name: android

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0" > /dev/null || \
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms/android-37.0" "build-tools/36.1.0" > /dev/null
      - name: Core tests, unit tests and the debug APK
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee build.log
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk the screens on stub data
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The runner runs each line on its own (no pipefail across lines), so Gradle's own exit code is saved,
          # never a pipe's: a walk that fails must fail the job.
          script: |
            adb shell rm -rf /sdcard/Download/aura-shots || true
            ./gradlew --console=plain --no-daemon :app:connectedDebugAndroidTest > app-test.log 2>&1; echo $? > walk-exit
            tail -n 200 app-test.log
            mkdir -p screenshots
            adb pull /sdcard/Download/aura-shots screenshots/ || true
            ls -R screenshots || true
            echo "connectedDebugAndroidTest exit code $(cat walk-exit)"
            exit $(cat walk-exit)
      - name: Keep the screenshots, reports, logs and APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-results
          path: |
            screenshots
            build.log
            app-test.log
            core/build/reports/tests
            app/build/reports
            app/build/outputs/androidTest-results
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn
