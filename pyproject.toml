[project]
name = "aura-mobile-demo"
version = "0.1.0"
description = "A phone-sized PyQt6 demo of the Aura mobile features, talking to the dev backend in us-west-1."
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7,<6.9",
    "httpx>=0.27",
    "keyring>=25",
    "tzdata>=2024.1",
    "tzlocal>=5.2",
]

[project.scripts]
aura-mobile = "aura_mobile.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_mobile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
