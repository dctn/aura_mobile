[project]
name = "aura-demo-website-tools"
version = "0.1.0"
description = "Dev-time helpers for the demo website: make the shared demo account and fill it with data. Never deployed."
requires-python = ">=3.12"
dependencies = ["aura-mobile-demo", "boto3>=1.35"]

[tool.uv]
package = false

[tool.uv.sources]
aura-mobile-demo = { path = "../../demo", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
